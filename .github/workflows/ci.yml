name: CI

on:
  push:
    branches: [ main, feat/*, fix/*, docs/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Security Verification
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --init
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          # qt6-multimedia (with an explicit backend, so --noconfirm never has
          # to pick a provider for us) is a real runtime dependency: the deck
          # UI suites load the overlay itself, and lib/SoundManager.qml imports
          # QtMultimedia. No audio server runs here, which SoundEffect tolerates.
          pacman -S --noconfirm --needed git python python-pip python-coverage qt6-declarative qt6-base qt6-multimedia qt6-multimedia-ffmpeg quickshell jq
      - name: Create non-root test user
        run: |
          useradd -m -u 1001 runner
          chmod 1777 /tmp
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup root-owned trusted commands and permissions
        run: |
          install -m 755 -o root -g root tests/mocks/hyprctl /usr/bin/hyprctl
          chown -R runner:runner "$GITHUB_WORKSPACE"
      - name: Install pinned fuzzing dependency as test user
        run: |
          su runner -c "python3 -m venv .venv"
          su runner -c ".venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements-dev.txt"
      - name: Validate Plugin Manifest
        run: |
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.id == "gerritwanderer.keycade-lazyvim"' manifest.json
          jq -e '.version != null' manifest.json
          jq -e '(.kinds | length) > 0' manifest.json
          jq -e '.entryPoints.overlay == "Keycade.qml"' manifest.json
          test -f Keycade.qml
      - name: Python Unit & Security Invariant Tests (with Coverage)
        run: |
          su runner -c "python3 -m coverage run --source=bin -m unittest discover -s tests -p 'test_*.py' -v"
          su runner -c "python3 -m coverage report"
          su runner -c "python3 -m coverage xml -o coverage.xml"
      - name: Atheris Parser Fuzzing Smoke Test
        run: |
          su runner -c ".venv/bin/python tests/fuzz_keybinds.py -runs=1000"
      - name: Prepare Codecov Token
        id: codecov-token
        env:
          RAW_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          CLEAN_TOKEN=$(python3 -c "import os, re; print(re.sub(r'[^0-9a-zA-Z-]', '', os.environ.get('RAW_TOKEN', '')))")
          echo "::add-mask::$CLEAN_TOKEN"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ steps.codecov-token.outputs.token }}
      - name: QML Algorithm Tests
        run: |
          # The core suite keeps its original invocation; every other
          # tests/qml/tst_*.qml suite runs with the same flags, one file per
          # qmltestrunner process, exactly like the local gate.
          su runner -c "QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME= QT_STYLE_OVERRIDE=Fusion /usr/lib/qt6/bin/qmltestrunner -input tests/qml/tst_algorithms.qml -import /usr/lib/qt6/qml"
          for suite in tests/qml/tst_*.qml; do
            [ "$suite" = "tests/qml/tst_algorithms.qml" ] && continue
            su runner -c "QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME= QT_STYLE_OVERRIDE=Fusion /usr/lib/qt6/bin/qmltestrunner -input $suite -import /usr/lib/qt6/qml"
          done
      - name: QML Shell Integration Tests
        run: |
          su runner -c "./tests/test_state_store_qml.sh"
          su runner -c "./tests/test_ground_switching_qml.sh"
          su runner -c "./tests/test_run_counters_qml.sh"
          su runner -c "./tests/test_mastery_transition_qml.sh"
      - name: Lint QML Components
        run: |
          su runner -c "/usr/lib/qt6/bin/qmllint -I /usr/lib/qt6/qml Keycade.qml lib/*.qml lib/sources/*.qml dev/InputProbe.qml"
